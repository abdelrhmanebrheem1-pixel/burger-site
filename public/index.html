 $('#hv').innerHTML='<img src="/E54AA528-463D-49B3-BADE-299A51D83CFD.png" alt="برجر" loading="eager" fetchpriority="high">';
 $('#fh').textContent='مواعيد العمل: '+s.hours;$('#fp').textContent='الهاتف: '+s.phone;$('#fa').textContent='العنوان: '+s.address;
 $('#fs').innerHTML=s.social.split('\n').map(l=>l.split('|')).filter(x=>/^https?:/.test(x[1]||'')).map(x=>`<a href="${esc(x[1].trim())}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join('');
 const f=D.products.filter(p=>p.featured);$('#best').hidden=!f.length;$('#bg').innerHTML=f.map(card).join('');
 $('#tabs').innerHTML=[{id:0,name:'الكل'},...D.categories].map(c=>`<button class="tab${c.id==cat?' on':''}" data-c="${c.id}">${esc(c.name)}</button>`).join('');
 $('#mg').innerHTML=D.products.filter(p=>!cat||p.category_id==cat).map(card).join('')||'<p>لا توجد أصناف في هذا القسم.</p>';
 $('#offers').hidden=!D.offers.length;
 $('#og').innerHTML=D.offers.map(o=>`<div class="offer"><div><small>العروض والوجبات المميزة</small><h3>${esc(o.title)}</h3><small>${esc(o.description)}</small><div class="pr">${o.old_price?`<s>${E(o.old_price)}</s> `:''}${E(o.price)} ر.س</div></div><button class="btn" data-o="${o.id}">اطلب العرض</button></div>`).join('');
 draw();
}
function tot(){return cart.reduce((a,i)=>a+i.unit*i.qty,0)}
function draw(){const n=cart.reduce((a,i)=>a+i.qty,0);$('#cb').innerHTML=`<span>${E(n)}</span>`;$('#bar').classList.toggle('on',n>0);$('#bs').textContent=E(n)+' أصناف · '+E(tot())+' ر.س'}
function add(it){const k=cart.find(c=>c.t==it.t&&c.id==it.id&&c.ad.join()==it.ad.join());k?k.qty+=it.qty:cart.push(it);draw()}
function openP(id){
 const p=D.products.find(x=>x.id==id),ad=JSON.parse(p.addons||'[]');let q=1;
 $('#pdc').innerHTML=`<div class="im">${img(p.image)}</div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p>${p.ingredients?`<p>المكونات: ${esc(p.ingredients)}</p>`:''}${ad.map((a,i)=>`<label class="ck"><input type="checkbox" value="${i}" style="width:auto"> ${esc(a.name)} <em>+${E(a.price)} ر.س</em></label>`).join('')}<div class="rw" style="margin-top:16px"><div class="qt"><button data-q="-1">−</button><b id="pq">1</b><button data-q="1">+</button></div><button class="btn" id="pa">أضف للسلة</button></div>`;
 $('#pdc').onclick=e=>{const d=e.target.dataset.q;if(d){q=Math.max(1,q+ +d);$('#pq').textContent=E(q)}};
 $('#pa').onclick=()=>{const sel=[...$('#pdc').querySelectorAll('input:checked')].map(i=>ad[i.value]);add({t:'p',id:p.id,name:p.name,unit:p.price+sel.reduce((a,x)=>a+x.price,0),qty:q,ad:sel.map(x=>x.name)});$('#pd').close()};
 $('#pd').showModal();
}
function cartUI(msg){
 const s=D.settings,fee=+s.delivery_fee||0;
 $('#cdc').innerHTML=msg||(cart.length?`<button type="button" class="btn sm" id="continueShopping" style="margin-bottom:16px">← متابعة التسوق والعودة للمنيو</button>${cart.map((c,i)=>`<div class="ci"><div><b>${esc(c.name)}</b><br><small>${esc(c.ad.join('، '))}</small><br><button type="button" data-remove="${i}" style="margin-top:6px;border:0;background:transparent;color:#c44;cursor:pointer;font:700 12px Cairo">حذف المنتج ✕</button></div><div class="qt"><button data-i="${i}" data-d="-1">−</button><b>${E(c.qty)}</b><button data-i="${i}" data-d="1">+</button></div><b>${E(c.unit*c.qty)} ر.س</b></div>`).join('')}
 <p>رسوم التوصيل: ${E(fee)} ر.س<br><b class="pr">الإجمالي: ${E(tot()+fee)} ر.س</b></p>
 <input id="fn" placeholder="الاسم" autocomplete="name"><input id="fph" placeholder="رقم الهاتف" type="tel" autocomplete="tel"><input id="fad" placeholder="عنوان التوصيل" autocomplete="street-address"><textarea id="fno" placeholder="ملاحظات الطلب" rows="2"></textarea><p style="margin:10px 0;color:#f2bd4b;font-weight:800">طريقة الدفع: الدفع عند الاستلام</p><div class="err" id="fe"></div><button class="btn" id="fgo" style="width:100%">تأكيد الطلب وإرسال التفاصيل إلى واتساب</button>`:'<p>السلة فارغة.</p><button type="button" class="btn" id="continueShopping">العودة للمنيو ومتابعة التسوق</button>');
}
$('#cdc').onclick=async e=>{
 const d=e.target.dataset;
 if(e.target.id==='continueShopping'){ $('#cd').close(); $('#menu').scrollIntoView({behavior:'smooth'}); return; }
 if(d.remove!==undefined){cart.splice(+d.remove,1);draw();cartUI();return}
 if(d.d){const c=cart[d.i];c.qty+=+d.d;if(c.qty<1)cart.splice(d.i,1);draw();cartUI()}
 if(e.target.id==='fgo'){
  const body={name:$('#fn').value,phone:$('#fph').value,address:$('#fad').value,notes:$('#fno').value,items:cart.map(c=>({t:c.t,id:c.id,qty:c.qty,addons:c.ad}))};
  const orderLines=cart.map(c=>'- '+c.name+' × '+c.qty+(c.ad.length?' (إضافات: '+c.ad.join('، ')+')':'')+' — '+E(c.unit*c.qty)+' ر.س').join('\n');
  const r=await fetch('/api/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),j=await r.json();
  if(!r.ok){$('#fe').textContent=j.error;return}
  const waText=[
   'طلب جديد - MARJAN 5 BURGER',
   'رقم الطلب: '+j.code,
   'الاسم: '+body.name,
   'رقم العميل: '+body.phone,
   'العنوان: '+body.address,
   'الأصناف:',
   orderLines,
   'الإجمالي شامل التوصيل: '+E(j.total)+' ر.س',
   'طريقة الدفع: الدفع عند الاستلام',
   body.notes?'ملاحظات: '+body.notes:''
  ].filter(Boolean).join('\n');
  const wa='https://wa.me/966559899362?text='+encodeURIComponent(waText);
  cart=[];draw();
  cartUI(`<h3>تم تسجيل طلبك بنجاح</h3><p>رقم الطلب: <b>${j.code}</b><br>الإجمالي: ${E(j.total)} ر.س<br><b style="color:#f2bd4b">الدفع عند الاستلام</b></p><a class="btn" target="_blank" rel="noopener" href="${wa}" style="width:100%;text-align:center">إرسال تفاصيل الطلب إلى واتساب</a><p style="color:#aaa;font-size:13px">اضغط الزر لإرسال تفاصيل الطلب للمطعم على واتساب.</p>`);
 }
};
document.addEventListener('click',e=>{
 const d=e.target.closest('[data-p],[data-o],[data-c]')?.dataset;if(!d)return;
 if(d.p)openP(d.p);
 if(d.o){const o=D.offers.find(x=>x.id==d.o);add({t:'o',id:o.id,name:o.title,unit:o.price,qty:1,ad:[]})}
 if(d.c!==undefined){cat=+d.c;init()}
});
$('#cb').onclick=$('#bgo').onclick=()=>{cartUI();$('#cd').showModal()};
init();
</script></body></html>
