<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>المطعم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&display=swap');
:root{--bg:#090909;--card:#111;--line:#292521;--ink:#f7f3ec;--mute:#aaa39a;--or:#f36b21;--or2:#ff8a3d}
*{box-sizing:border-box}
html{scroll-behavior:smooth;color-scheme:dark;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;padding-bottom:90px;background-image:radial-gradient(ellipse at 80% 8%,rgba(243,107,33,.09),transparent 32%),linear-gradient(180deg,#090909 0%,#0d0c0b 55%,#090909 100%)}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:22px;padding:15px clamp(20px,5vw,76px);border-bottom:1px solid rgba(255,255,255,.08);background:rgba(9,9,9,.9);backdrop-filter:blur(18px)}
#logo{color:var(--ink);font-weight:900;font-size:25px;letter-spacing:.5px}#logo img{height:42px;max-width:160px;object-fit:contain}
nav{display:flex;align-items:center;gap:clamp(14px,2.4vw,34px);font-size:13px;font-weight:700;color:#d2ccc4}
nav a{transition:color .2s}nav a:hover{color:var(--or)}
.hd{display:flex;gap:9px}
.ic{width:43px;height:43px;border-radius:50%;border:1px solid #39332d;background:#111;color:var(--ink);cursor:pointer;font:800 15px Cairo;transition:.2s}
.ic:hover{border-color:var(--or);transform:translateY(-2px)}
.ic.or{background:var(--or);border-color:var(--or);color:#160b05;box-shadow:0 5px 24px #f36b2138}
section{padding:0 clamp(20px,5vw,76px);max-width:1440px;margin:0 auto}
.hero{position:relative;display:grid;grid-template-columns:.92fr 1.08fr;gap:clamp(24px,5vw,76px);align-items:center;min-height:570px;padding-top:58px;padding-bottom:68px}
.eb{color:var(--or2);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
h1{font-family:'Barlow Condensed',Cairo,sans-serif;font-size:clamp(58px,8.5vw,116px);line-height:.96;letter-spacing:-1px;margin:17px 0 22px;font-weight:900;max-width:680px}
.hero p{color:#b8b0a7;line-height:2;font-size:16px;max-width:480px}
.btn{background:var(--or);color:#170b04;border:1px solid var(--or);border-radius:3px;padding:14px 30px;font:900 14px Cairo;cursor:pointer;display:inline-block;letter-spacing:.2px;transition:transform .2s,background .2s,box-shadow .2s}
.btn:hover{background:var(--or2);transform:translateY(-3px);box-shadow:0 10px 30px #f36b2130}
.btn.ol{background:transparent;color:var(--ink);border:1px solid #71675d;font-weight:700}.btn.ol:hover{border-color:var(--or);color:var(--or)}.btn.sm{padding:9px 18px;font-size:13px}
.hv{position:relative;aspect-ratio:1.12;border-radius:4px;border:1px solid #3b3028;background:linear-gradient(145deg,#1b1713,#0e0d0c);display:grid;place-items:center;color:#8d8175;overflow:hidden;box-shadow:22px 22px 0 rgba(243,107,33,.08)}
.hv:empty:after{content:"";position:absolute;inset:10%;border:1px solid #ffffff0b;pointer-events:none}
.hv img{width:100%;height:100%;object-fit:cover;transition:transform .7s}.hv:hover img{transform:scale(1.035)}
h2{font-family:'Barlow Condensed',Cairo,sans-serif;font-size:clamp(36px,5vw,58px);letter-spacing:.3px;margin:64px 0 24px;font-weight:900;text-transform:uppercase}
.tabs{display:flex;gap:9px;overflow-x:auto;margin-bottom:24px;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:none;border:1px solid #39332d;background:#111;color:#d6cec5;padding:9px 20px;border-radius:2px;font:700 13px Cairo;cursor:pointer;transition:.2s}
.tab:hover{border-color:var(--or);color:var(--or)}.tab.on{background:var(--or);border-color:var(--or);color:#160b05}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:18px}
.card{background:linear-gradient(160deg,#171513,#10100f);border:1px solid #2b2723;border-radius:3px;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);border-color:#6c3a20;box-shadow:0 18px 40px #0008}
.im{height:230px;background:linear-gradient(145deg,#211b16,#111);display:grid;place-items:center;color:#81766b;font-size:13px;position:relative;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.card:hover .im img{transform:scale(1.055)}
.bd{position:absolute;top:14px;inset-inline-end:14px;background:var(--or);color:#160b05;font-size:11px;font-weight:900;padding:5px 12px;border-radius:2px;z-index:1}
.cb{padding:19px 20px 21px}.cb h3{margin:0 0 7px;font-size:19px;font-weight:800}.cb p{margin:0 0 18px;color:#a9a198;font-size:13px;line-height:1.9;min-height:46px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pr{color:var(--or2);font-weight:900;font-size:19px}.pr s{color:#8f877e;font-size:12px;font-weight:400}.na{color:#e5645a;font-size:13px}
.offer{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(110deg,#24160e,#13110f 68%);border:1px solid #50301e;border-radius:3px;padding:clamp(24px,4vw,48px);margin-bottom:16px;overflow:hidden}
.offer:after{content:"";position:absolute;width:220px;height:220px;border:1px solid #f36b2126;border-radius:50%;inset-inline-end:-70px;top:-90px;box-shadow:0 0 0 24px #f36b2108,0 0 0 48px #f36b2105;pointer-events:none}
.offer h3{font-family:'Barlow Condensed',Cairo,sans-serif;font-size:clamp(28px,4vw,42px);margin:7px 0;font-weight:900}.offer small{color:#b8a99b}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;color:#9d958c;font-size:13px;padding:36px clamp(20px,5vw,76px);border-top:1px solid #292521;margin-top:76px;background:#080808}
footer a{color:var(--or);margin-inline-start:12px}
dialog{background:#141210;color:var(--ink);border:1px solid #514032;border-radius:4px;padding:0;width:min(520px,94vw);max-height:90vh;box-shadow:0 24px 80px #000b}
dialog::backdrop{background:#000c;backdrop-filter:blur(5px)}.dl{padding:22px}.dl .im{border-radius:3px;margin-bottom:14px}
.ck{display:block;padding:9px 0;border-bottom:1px solid var(--line)}.ck em{color:var(--or);font-style:normal}
.qt{display:flex;align-items:center;gap:12px}.qt button{width:34px;height:34px;border-radius:2px;border:0;background:var(--or);font:800 18px Cairo;cursor:pointer}
input,textarea{width:100%;background:#0b0b0b;border:1px solid #39332d;color:var(--ink);border-radius:2px;padding:12px;font:inherit;margin:6px 0}
input:focus,textarea:focus{border-color:var(--or);outline:none}
.ci{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:8px}
.bar{display:none;position:fixed;inset:auto 0 0;background:rgba(15,14,13,.96);border-top:1px solid #49301f;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0));align-items:center;justify-content:space-between;z-index:30;backdrop-filter:blur(14px)}
.bar.on{display:flex}.err{color:#e5645a;font-size:14px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media(max-width:800px){
 header{padding:12px 18px}section{padding-inline:18px}footer{padding-inline:18px}nav{display:none}
 .hero{grid-template-columns:1fr;gap:26px;min-height:auto;padding-top:38px;padding-bottom:42px}
 h1{font-size:clamp(58px,15vw,86px)}.hv{aspect-ratio:1.15;order:2;box-shadow:10px 10px 0 rgba(243,107,33,.08)}
 h2{margin-top:48px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
 .im{height:auto;aspect-ratio:1.15}.cb{padding:13px}.cb h3{font-size:16px}.cb p{font-size:12px;min-height:0;margin-bottom:13px}
 .pr{font-size:15px}.btn.sm{padding:8px 12px;font-size:12px}.offer{flex-direction:column;align-items:flex-start;padding:24px}
 footer{margin-top:50px}
}
@media(max-width:390px){.grid{grid-template-columns:1fr}.im{aspect-ratio:1.45}}
</style></head><body>
<header><a id="logo" href="#"></a><nav><a href="#">الرئيسية</a><a href="#menu">المنيو</a><a href="#offers">العروض</a><a href="#about">من نحن</a><a href="#about">تواصل معنا</a></nav>
<div class="hd"><a class="ic" href="#menu" style="display:grid;place-items:center" aria-label="بحث">⌕</a><button class="ic or" id="cb" aria-label="السلة">٠</button></div></header>
<section class="hero"><div><div class="eb" id="he"></div><h1 id="ht"></h1><p id="hp"></p><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px"><a class="btn" href="#menu">اطلب الآن</a><a class="btn ol" href="#menu">اكتشف المنيو</a></div></div><div class="hv" id="hv">مكان صورة البرجر الحقيقية</div></section>
<section id="best" hidden><h2>الأكثر مبيعًا</h2><div class="grid" id="bg"></div></section>
<section id="menu"><h2>المنيو</h2><div class="tabs" id="tabs"></div><div class="grid" id="mg"></div></section>
<section id="offers" hidden><h2>العروض والوجبات المميزة</h2><div id="og"></div></section>
<footer id="about"><span id="fh"></span><span id="fp"></span><span id="fa"></span><span id="fs"></span></footer>
<div class="bar" id="bar"><div id="bs"></div><button class="btn" id="bgo">إتمام الطلب</button></div>
<dialog id="pd"><div class="dl" id="pdc"></div></dialog><dialog id="cd"><div class="dl" id="cdc"></div></dialog>
<script>
let D,cart=[],cat=0;
const $=s=>document.querySelector(s),E=n=>(+n).toLocaleString('ar-EG'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=u=>u?`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('صورة الصنف'))">`:'صورة الصنف';
const card=p=>`<article class="card"><div class="im">${p.badge?`<b class="bd">${esc(p.badge)}</b>`:''}${img(p.image)}</div><div class="cb"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="rw"><div class="pr">${p.old_price?`<s>${E(p.old_price)}</s> `:''}${E(p.price)} ج.م</div>${p.available?`<button class="btn sm" data-p="${p.id}">أضف للسلة</button>`:'<span class="na">غير متاح</span>'}</div></div></article>`;
async function init(){
 D=await (await fetch('/api/public')).json();const s=D.settings;document.title=s.name;
 $('#logo').innerHTML=s.logo?`<img src="${esc(s.logo)}" alt="${esc(s.name)}">`:esc(s.name);
 $('#he').textContent=s.hero_eyebrow;$('#ht').textContent=s.hero_title;$('#hp').textContent=s.hero_text;
 if(s.hero_image)$('#hv').innerHTML=img(s.hero_image);
 $('#fh').textContent='مواعيد العمل: '+s.hours;$('#fp').textContent='الهاتف: '+s.phone;$('#fa').textContent='العنوان: '+s.address;
 $('#fs').innerHTML=s.social.split('\n').map(l=>l.split('|')).filter(x=>/^https?:/.test(x[1]||'')).map(x=>`<a href="${esc(x[1].trim())}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join('');
 const f=D.products.filter(p=>p.featured);$('#best').hidden=!f.length;$('#bg').innerHTML=f.map(card).join('');
 $('#tabs').innerHTML=[{id:0,name:'الكل'},...D.categories].map(c=>`<button class="tab${c.id==cat?' on':''}" data-c="${c.id}">${esc(c.name)}</button>`).join('');
 $('#mg').innerHTML=D.products.filter(p=>!cat||p.category_id==cat).map(card).join('')||'<p>لا توجد أصناف في هذا القسم.</p>';
 $('#offers').hidden=!D.offers.length;
 $('#og').innerHTML=D.offers.map(o=>`<div class="offer"><div><small>العروض والوجبات المميزة</small><h3>${esc(o.title)}</h3><small>${esc(o.description)}</small><div class="pr">${o.old_price?`<s>${E(o.old_price)}</s> `:''}${E(o.price)} ج.م</div></div><button class="btn" data-o="${o.id}">اطلب العرض</button></div>`).join('');
 draw();
}
function tot(){return cart.reduce((a,i)=>a+i.unit*i.qty,0)}
function draw(){const n=cart.reduce((a,i)=>a+i.qty,0);$('#cb').textContent=E(n);$('#bar').classList.toggle('on',n>0);$('#bs').textContent=E(n)+' أصناف · '+E(tot())+' ج.م'}
function add(it){const k=cart.find(c=>c.t==it.t&&c.id==it.id&&c.ad.join()==it.ad.join());k?k.qty+=it.qty:cart.push(it);draw()}
function openP(id){
 const p=D.products.find(x=>x.id==id),ad=JSON.parse(p.addons||'[]');let q=1;
 $('#pdc').innerHTML=`<div class="im">${img(p.image)}</div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p>${p.ingredients?`<p>المكونات: ${esc(p.ingredients)}</p>`:''}${ad.map((a,i)=>`<label class="ck"><input type="checkbox" value="${i}" style="width:auto"> ${esc(a.name)} <em>+${E(a.price)} ج.م</em></label>`).join('')}<div class="rw" style="margin-top:16px"><div class="qt"><button data-q="-1">−</button><b id="pq">1</b><button data-q="1">+</button></div><button class="btn" id="pa">أضف للسلة</button></div>`;
 $('#pdc').onclick=e=>{const d=e.target.dataset.q;if(d){q=Math.max(1,q+ +d);$('#pq').textContent=E(q)}};
 $('#pa').onclick=()=>{const sel=[...$('#pdc').querySelectorAll('input:checked')].map(i=>ad[i.value]);add({t:'p',id:p.id,name:p.name,unit:p.price+sel.reduce((a,x)=>a+x.price,0),qty:q,ad:sel.map(x=>x.name)});$('#pd').close()};
 $('#pd').showModal();
}
function cartUI(msg){
 const s=D.settings,fee=+s.delivery_fee||0;
 $('#cdc').innerHTML=msg||(cart.length?`${cart.map((c,i)=>`<div class="ci"><div>${esc(c.name)}<br><small>${esc(c.ad.join('، '))}</small></div><div class="qt"><button data-i="${i}" data-d="-1">−</button><b>${E(c.qty)}</b><button data-i="${i}" data-d="1">+</button></div><b>${E(c.unit*c.qty)} ج.م</b></div>`).join('')}
 <p>رسوم التوصيل: ${E(fee)} ج.م<br><b class="pr">الإجمالي: ${E(tot()+fee)} ج.م</b></p>
 <input id="fn" placeholder="الاسم" autocomplete="name"><input id="fph" placeholder="رقم الهاتف" type="tel" autocomplete="tel"><input id="fad" placeholder="عنوان التوصيل" autocomplete="street-address"><textarea id="fno" placeholder="ملاحظات الطلب" rows="2"></textarea><div class="err" id="fe"></div><button class="btn" id="fgo" style="width:100%">تأكيد الطلب</button>`:'<p>السلة فارغة.</p>');
}
$('#cdc').onclick=async e=>{
 const d=e.target.dataset;if(d.d){const c=cart[d.i];c.qty+=+d.d;if(c.qty<1)cart.splice(d.i,1);draw();cartUI()}
 if(e.target.id==='fgo'){
  const body={name:$('#fn').value,phone:$('#fph').value,address:$('#fad').value,notes:$('#fno').value,items:cart.map(c=>({t:c.t,id:c.id,qty:c.qty,addons:c.ad}))};
  const r=await fetch('/api/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),j=await r.json();
  if(!r.ok){$('#fe').textContent=j.error;return}
  cart=[];draw();const w=D.settings.whatsapp.replace(/\D/g,'');
  cartUI(`<h3>تم استلام طلبك</h3><p>رقم الطلب: <b>${j.code}</b><br>الإجمالي: ${E(j.total)} ج.م</p>${w?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${w}?text=${encodeURIComponent('طلب رقم '+j.code)}">تأكيد على واتساب</a>`:''}`);
 }
};
document.addEventListener('click',e=>{
 const d=e.target.closest('[data-p],[data-o],[data-c]')?.dataset;if(!d)return;
 if(d.p)openP(d.p);
 if(d.o){const o=D.offers.find(x=>x.id==d.o);add({t:'o',id:o.id,name:o.title,unit:o.price,qty:1,ad:[]})}
 if(d.c!==undefined){cat=+d.c;init()}
});
$('#cb').onclick=$('#bgo').onclick=()=>{cartUI();$('#cd').showModal()};
init();
</script></body></html>
